<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kumataWorld!</title>
  <link rel="icon" href="assets/kumata.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>

  <header class="site-header">
    <div class="wrap">
      <a class="logo" href="index.html">
        <img src="assets/kumata.png" alt="kumata">
        <span class="logo-text">kumata<span class="w">World</span><span class="bang">!</span></span>
      </a>
      <nav class="nav">
        <a class="home" href="index.html">ホーム</a>
        <a class="edu" href="index.html#edu">まなぶ</a>
        <a class="play" href="index.html#play">あそぶ</a>
      </nav>
    </div>
  </header>

  <main class="wrap" id="detail">
    <a class="back" href="index.html">← ゲーム いちらんに もどる</a>

    <div class="detail-head">
      <h1 id="g-title">ゲーム</h1>
      <span class="badge" id="g-badge"></span>
    </div>

    <div class="detail-grid">
      <!-- 左:プレイ画面・説明 -->
      <div>
        <div class="stage" id="stage">
          <div class="stage-cover" id="stage-cover"></div>
        </div>
        <div class="stage-tools" id="stage-tools"></div>

        <div class="panel">
          <h2>📝 どんな ゲーム?</h2>
          <div id="g-desc"></div>
        </div>

        <div class="panel">
          <h2>📸 スクリーンショット</h2>
          <div class="shots-main" id="shots-main"></div>
          <div class="shots-thumbs" id="shots-thumbs"></div>
        </div>
      </div>

      <!-- 右:あそぶ/ダウンロード・操作説明 -->
      <aside>
        <div class="panel get-panel" id="get-panel"></div>

        <div class="panel">
          <h2>🕹️ そうさ せつめい</h2>
          <div class="controls-switch" id="controls-switch"></div>
          <ul class="controls-list" id="controls-list"></ul>
        </div>

        <div class="panel">
          <h2>ℹ️ じょうほう</h2>
          <table class="info-table" id="info-table"></table>
        </div>
      </aside>
    </div>
  </main>

  <footer class="site-footer">
    <img src="assets/kumata.png" alt="">
    <div>© <span id="year"></span> kumataWorld!</div>
  </footer>

  <script src="js/games.js?v=3"></script>
  <script src="js/common.js?v=3"></script>
  <script src="js/counter-config.js?v=3"></script>
  <script src="js/counter.js?v=3"></script>
  <script src="js/game.js?v=3"></script>
</body>
</html>

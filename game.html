<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <script>
  // 古い ページが スマホに のこっていたら、新しい ページを 読みなおす(version.txt と games.js の 番号を くらべる)
  (function () {
    try {
      fetch("version.txt?t=" + Date.now(), { cache: "no-store" }).then(function (r) { return r.ok ? r.text() : ""; }).then(function (t) {
        var v = parseInt(t, 10);
        var sc = document.querySelector('script[src*="games.js"]');
        var pageV = sc ? parseInt(sc.getAttribute("src").split("v=")[1], 10) : 0;
        if (!(v > pageV) || !pageV) return;
        var key = "kw_reload_" + v;
        if (sessionStorage.getItem(key)) return;   // 1回だけ
        sessionStorage.setItem(key, "1");
        var u = new URL(location.href);
        u.searchParams.set("_r", v);
        location.replace(u.toString());
      }).catch(function () {});
    } catch (e) {}
  })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kumataWorld!</title>
  <meta name="description" content="kumataWorld! の無料で遊べるゲーム。">
  <link rel="icon" href="assets/kumata.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=45">
</head>
<body>

      <a class="logo" href="index.html">

        <span class="logo-text">kumata<span class="w">World</span><span class="bang">!</span></span>
      </a>
      <nav class="nav">
        <a class="home" href="index.html">ホーム</a>
        <a class="edu" href="index.html#edu">まなぶ</a>
        <a class="play" href="index.html#play">あそぶ</a>

    </div>
  </header>

  <main class="wrap" id="detail">

    <div class="detail-head">
      <h1 id="g-title">ゲーム</h1>
      <span class="badge" id="g-badge"></span>
    </div>

    <div class="detail-grid">
      <!-- 左:プレイ画面・説明 -->
      <div>
        <div class="stage" id="stage">

        <div class="panel">

          <div class="shots-main" id="shots-main"></div>
          <div class="shots-thumbs" id="shots-thumbs"></div>
        </div>
      </div>

      <!-- 右:あそぶ/ダウンロード・操作説明 -->
      <aside>
        <div class="panel get-panel" id="get-panel"></div>

        <div class="panel">
          <h2>🕹️ そうさ せつめい</h2>
          <div class="controls-switch" id="controls-switch"></div>
          <ul class="controls-list" id="controls-list"></ul>
        </div>

        <div class="panel">
          <h2>ℹ️ じょうほう</h2>

      </aside>
    </div>
  </main>

  <footer class="site-footer">
    <img src="assets/kumata.png" alt="">

  </footer>

  <script src="js/game.js?v=45"></script>
  <script src="js/video-modal.js?v=45"></script>
  <script src="js/game-reviews.js?v=45"></script>
</body>
